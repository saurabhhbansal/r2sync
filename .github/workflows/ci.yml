name: CI Tests

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test on ${{ matrix.os }} (Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.11', '3.12']

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'

      - name: Install system Qt libraries on Linux
        if: runner.os == 'Linux'
        timeout-minutes: 5
        # NOT suffixed with "|| true". These are what PySide6 needs to import;
        # when the install was allowed to fail quietly every GUI test skipped
        # itself and the job still went green.
        run: |
          sudo timeout 120 apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3 libxcb-cursor0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Check the version strings agree
        # Cheap, and catches the drift on the PR that introduces it rather than
        # at release time when a tag has already been pushed.
        shell: bash
        run: python packaging/check_version.py

      - name: Install rclone
        # tests/test_sync_e2e.py drives a real rclone binary and skips itself
        # when there is none, so without this step the entire end-to-end suite
        # passed by never running at all -- on main and on release tags alike.
        # The version is read from r2sync's own config so CI always exercises
        # the same binary the application downloads for users.
        shell: bash
        run: |
          set -euo pipefail
          version="$(python -c 'from r2sync.config import RCLONE_VERSION; print(RCLONE_VERSION)')"
          case "${RUNNER_OS}" in
            Linux)   pkg="rclone-${version}-linux-amd64";   bin="rclone"     ;;
            Windows) pkg="rclone-${version}-windows-amd64"; bin="rclone.exe" ;;
            macOS)   pkg="rclone-${version}-osx-amd64";     bin="rclone"     ;;
            *) echo "unsupported runner: ${RUNNER_OS}" >&2; exit 1 ;;
          esac
          curl -fsSL -o rclone.zip "https://downloads.rclone.org/${version}/${pkg}.zip"
          unzip -q rclone.zip
          mkdir -p "${HOME}/.local/bin"
          mv "${pkg}/${bin}" "${HOME}/.local/bin/${bin}"
          chmod +x "${HOME}/.local/bin/${bin}"
          rm -rf rclone.zip "${pkg}"
          # Later steps read GITHUB_PATH, but they do not all run in this
          # shell: on Windows this step is Git Bash, where ${HOME} is an MSYS
          # path (/c/Users/...), while the test step is PowerShell, which
          # cannot resolve one. Write the native form or pytest sees no rclone
          # and the suite errors out on a binary that is sitting right there.
          if [[ "${RUNNER_OS}" == "Windows" ]]; then
            cygpath -w "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          else
            echo "${HOME}/.local/bin" >> "${GITHUB_PATH}"
          fi

      - name: Verify rclone is on PATH for the end-to-end tests
        # Fails the job rather than letting test_sync_e2e.py skip itself again.
        # No `shell:` on purpose -- this has to run in the job's default shell,
        # the one pytest starts in, and resolve the binary the same way
        # test_sync_e2e.py does. A bash-only check went green on Windows while
        # the PowerShell test step could not find rclone at all.
        run: |
          rclone version
          python -c "import shutil, sys; p = shutil.which('rclone'); print('shutil.which:', p); sys.exit(0 if p else 1)"

      - name: Run test suite
        env:
          QT_QPA_PLATFORM: offscreen
          # Turns "optional dependency missing" from a silent skip into a hard
          # failure. Only genuine platform skips (Windows-only tests on Linux)
          # remain. See tests/conftest.py.
          R2SYNC_REQUIRE_FULL_SUITE: '1'
        run: |
          pytest -v -rs
